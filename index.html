lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joint Genesis - Advanced Joint Support Supplement</title>
    <style>
        :root {
            --primary-pink: #ff6b9d;
            --dark-pink: #d84b78;
            --light-pink: #fff0f5;
            --bg-gradient: linear-gradient(180deg, #ffe4ec 0%, #ffffff 100%);
            --text-dark: #2b2b2b;
            --text-muted: #555555;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(216, 75, 120, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            background-color: var(--white);
            line-height: 1.6;
        }

        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            margin: 0 15px;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary-pink);
        }

        .nav-btn {
            background-color: var(--primary-pink);
            color: var(--white);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            transition: background-color 0.3s;
        }

        .nav-btn:hover {
            background-color: var(--dark-pink);
            color: var(--white);
        }

        .hero {
            background: var(--bg-gradient);
            padding: 60px 20px;
            text-align: center;
        }

        .hero-container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 42px;
            font-weight: 900;
            color: var(--text-dark);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .hero-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .product-image {
            max-width: 280px;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15));
        }

        .hero-product-info {
            text-align: left;
            max-width: 450px;
        }

        .product-title {
            font-size: 48px;
            font-weight: 800;
            margin: 0 0 5px 0;
        }

        .product-subtitle {
            font-size: 18px;
            color: var(--primary-pink);
            font-weight: 700;
            margin: 0 0 25px 0;
        }

        .bullets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
